<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Browser API test</title>
<style>body{font:20px sans-serif;background:white;color:#111;padding:16px}button,input{font:inherit;padding:16px;display:block;margin:12px 0}video{width:180px;height:120px}</style>
<h1>Browser API test</h1><main></main><pre id="status"></pre>
<script>
const mode=location.pathname.split('/').pop(), q=new URLSearchParams(location.search), id=q.get('id')||'test';
const marker=crypto.randomUUID();
function report(value){fetch('/report?'+encodeURIComponent(value));document.querySelector('#status').textContent=value}
function button(label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=fn;document.querySelector('main').append(b)}
function timeout(p,ms=12000){let timer;return Promise.race([p,new Promise((_,reject)=>timer=setTimeout(()=>reject(Error('timeout')),ms))]).finally(()=>clearTimeout(timer))}
function assert(value){if(!value)throw Error('wrong result')}
async function check(name,fn){try{const value=await timeout(fn());report('api-result:'+JSON.stringify({name,ok:true,value}))}catch(e){report('api-result:'+JSON.stringify({name,ok:false,error:e.name+':'+e.message}))}}
if(mode==='core'){
 const capabilities={secure:isSecureContext,geolocation:!!navigator.geolocation,media:!!navigator.mediaDevices?.getUserMedia,bluetooth:!!navigator.bluetooth,usb:!!navigator.usb,serial:!!navigator.serial,hid:!!navigator.hid,share:!!navigator.share,clipboard:!!navigator.clipboard,openPicker:!!window.showOpenFilePicker,savePicker:!!window.showSaveFilePicker,directoryPicker:!!window.showDirectoryPicker,opfs:!!navigator.storage?.getDirectory,push:!!window.PushManager,notifications:!!window.Notification,displayMedia:!!navigator.mediaDevices?.getDisplayMedia,webgl2:!!document.createElement('canvas').getContext('webgl2')};
 report('api-capabilities:'+JSON.stringify(capabilities));
 Promise.all([
 check('websocket',()=>new Promise((resolve,reject)=>{const w=new WebSocket('ws://'+location.host+'/socket');w.onopen=()=>w.send(marker);w.onmessage=e=>{w.close();e.data===marker?resolve():reject(Error('echo mismatch'))};w.onerror=()=>reject(Error('websocket error'))})),
 check('webassembly',async()=>{const result=await WebAssembly.instantiate(new Uint8Array([0,97,115,109,1,0,0,0]));assert(result.instance instanceof WebAssembly.Instance)}),
 check('webgl',async()=>{const c=document.createElement('canvas');c.width=c.height=2;const g=c.getContext('webgl2');assert(g);g.clearColor(1,0,0,1);g.clear(g.COLOR_BUFFER_BIT);const px=new Uint8Array(4);g.readPixels(0,0,1,1,g.RGBA,g.UNSIGNED_BYTE,px);assert(px[0]===255&&px[1]===0&&px[3]===255);g.getExtension('WEBGL_lose_context')?.loseContext()}),
 check('webrtcDataChannel',async()=>{const a=new RTCPeerConnection({iceServers:[]}),b=new RTCPeerConnection({iceServers:[]}),toA=[],toB=[];try{a.onicecandidate=e=>{if(e.candidate){if(b.remoteDescription)b.addIceCandidate(e.candidate);else toB.push(e.candidate)}};b.onicecandidate=e=>{if(e.candidate){if(a.remoteDescription)a.addIceCandidate(e.candidate);else toA.push(e.candidate)}};let resolve,reject;const received=new Promise((r,j)=>{resolve=r;reject=j});b.ondatachannel=e=>{e.channel.onmessage=m=>e.channel.send(m.data)};const c=a.createDataChannel('fixture');c.onopen=()=>c.send(marker);c.onmessage=e=>e.data===marker?resolve():reject(Error('RTC mismatch'));c.onerror=()=>reject(Error('RTC channel error'));await a.setLocalDescription(await a.createOffer());await b.setRemoteDescription(a.localDescription);for(const candidate of toB)await b.addIceCandidate(candidate);await b.setLocalDescription(await b.createAnswer());await a.setRemoteDescription(b.localDescription);for(const candidate of toA)await a.addIceCandidate(candidate);await timeout(received,10000)}finally{a.close();b.close()}}),
 check('localStorage',async()=>{localStorage.setItem('api-test',marker);assert(localStorage.getItem('api-test')===marker);localStorage.removeItem('api-test')}),
 check('sessionStorage',async()=>{sessionStorage.setItem('api-test',marker);assert(sessionStorage.getItem('api-test')===marker)}),
 check('indexedDB',()=>new Promise((resolve,reject)=>{const r=indexedDB.open('api-test',1);r.onupgradeneeded=()=>r.result.createObjectStore('values');r.onerror=()=>reject(r.error);r.onsuccess=()=>{const db=r.result,t=db.transaction('values','readwrite');t.objectStore('values').put(marker,'key');t.oncomplete=()=>{const get=db.transaction('values').objectStore('values').get('key');get.onsuccess=()=>{try{assert(get.result===marker);db.close();resolve()}catch(e){reject(e)}};get.onerror=()=>reject(get.error)};t.onerror=()=>reject(t.error)}})),
 check('opfs',async()=>{const root=await navigator.storage.getDirectory(),file=await root.getFileHandle('api-test.txt',{create:true}),w=await file.createWritable();await w.write(marker);await w.close();assert(await(await file.getFile()).text()===marker);await root.removeEntry('api-test.txt')}),
 check('cacheStorage',async()=>{const c=await caches.open('api-test');await c.put('/api-cached',new Response(marker));assert(await(await c.match('/api-cached')).text()===marker);await caches.delete('api-test')}),
 check('broadcastChannel',()=>new Promise((resolve,reject)=>{const a=new BroadcastChannel(marker),b=new BroadcastChannel(marker);b.onmessage=e=>{a.close();b.close();e.data===marker?resolve():reject(Error('message mismatch'))};a.postMessage(marker)})),
 check('worker',()=>new Promise((resolve,reject)=>{const u=URL.createObjectURL(new Blob(['onmessage=e=>postMessage(e.data+1)'],{type:'text/javascript'})),w=new Worker(u);w.onmessage=e=>{w.terminate();URL.revokeObjectURL(u);e.data===42?resolve():reject(Error('worker mismatch'))};w.onerror=reject;w.postMessage(41)})),
 check('crypto',async()=>{const key=await crypto.subtle.generateKey({name:'AES-GCM',length:128},false,['encrypt','decrypt']),iv=crypto.getRandomValues(new Uint8Array(12)),plain=new TextEncoder().encode(marker),encrypted=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,plain);assert(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,encrypted))===marker)}),
 check('blobRead',async()=>assert(await new Blob([marker]).text()===marker)),
 check('storageEstimate',async()=>{const e=await navigator.storage.estimate();assert(e.quota>0);return e}),
 check('wakeLock',async()=>{const l=await navigator.wakeLock.request('screen');assert(!l.released);await l.release();assert(l.released)}),
 check('canvas',async()=>{const c=document.createElement('canvas'),g=c.getContext('2d');g.fillStyle='#ff0000';g.fillRect(0,0,1,1);assert(g.getImageData(0,0,1,1).data[0]===255)})
 ]).then(()=>report('api-core-complete'));
}
if(mode==='location')button('Get location',()=>navigator.geolocation.getCurrentPosition(p=>report('geo-success:'+JSON.stringify({latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy})),e=>report('geo-error:'+e.code+':'+e.message),{enableHighAccuracy:true,timeout:15000,maximumAge:0}));
if(mode==='media')button('Start camera and microphone',async()=>{try{const stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});const video=document.createElement('video');video.muted=true;video.autoplay=true;video.playsInline=true;video.srcObject=stream;document.querySelector('main').append(video);await video.play();await timeout(new Promise(resolve=>video.requestVideoFrameCallback(resolve)));report('media-success:'+JSON.stringify(stream.getTracks().map(t=>({kind:t.kind,state:t.readyState,settings:t.getSettings()}))));stream.getTracks().forEach(t=>t.stop());report('media-stopped:'+stream.getTracks().every(t=>t.readyState==='ended'))}catch(e){report('media-error:'+e.name+':'+e.message)}});
if(mode==='upload'){const f=document.createElement('input');f.type='file';f.accept='text/plain';f.setAttribute('aria-label','Choose test file');f.onchange=async()=>{try{const file=f.files[0];report('upload-chosen:'+file?.name);report('upload:'+file.name+':'+await file.text())}catch(e){report('upload-error:'+e.name+':'+e.message)}};document.querySelector('main').append(f)}
if(mode==='clipboard'){button('Copy test text',async()=>{try{await navigator.clipboard.writeText('SearchLauncher clipboard fixture');report('clipboard-written')}catch(e){report('clipboard-write-error:'+e.name)}});button('Paste test text',async()=>{try{report('clipboard-read:'+await navigator.clipboard.readText())}catch(e){report('clipboard-read-error:'+e.name)}});button('Share test text',async()=>{try{await navigator.share({title:'Browser API test',text:'SearchLauncher share fixture'});report('share-success')}catch(e){report('share-error:'+e.name)}})}
if(mode==='stress'){const buffer=new Uint8Array(2*1024*1024);buffer.fill(41);window.stressBuffer=buffer;const old=sessionStorage.getItem('stress-'+id);sessionStorage.setItem('stress-'+id,id);report('stress-loaded:'+id+':'+marker+':restored='+!!old);button('Check tab '+id,()=>report('stress-check:'+id+':'+marker+':'+(buffer[100]===41&&sessionStorage.getItem('stress-'+id)===id)));button('Reload tab '+id,()=>location.reload());document.addEventListener('visibilitychange',()=>report('stress-visibility:'+id+':'+document.visibilityState))}
report('api-ready:'+mode);
</script>
