name: Android CI

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4
      # 21 to match F-Droid's buildserver, which ships no other JDK. The APK we release has to
      # come out of the same compiler as the one F-Droid builds from source, or reproducible-build
      # verification fails. The app still targets 17 bytecode; see jvmTarget below.
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install browser compile SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Check code formatting
        run: ./gradlew spotlessCheck
      # Cheap, and catches the two things that only show up at upload time: store text that
      # was edited in the generated file instead of the source, and a changelog too long
      # for Play's 500-character limit. Standard library only, so nothing to install.
      - name: Test Play APK verification
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Check store text
        run: python3 marketing/copy.py --check
      - name: Decode Keystore
        if: ${{ env.SIGNING_KEY_STORE_BASE64 != '' }}
        run: |
          printf '%s' "$SIGNING_KEY_STORE_BASE64" | base64 -d > app/upload.jks

      - name: Build with Gradle
        env:
          SIGNING_KEY_STORE_PATH: upload.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./gradlew assembleRelease
          else
            ./gradlew assemblePreview
          fi
      - name: Run unit tests
        run: ./gradlew test

      # Play takes a bundle rather than an APK. Only worth building on a tag, since nothing
      # else consumes it, and it is a second full R8 pass.
      - name: Build App Bundle
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGNING_KEY_STORE_BASE64 != ''
        env:
          SIGNING_KEY_STORE_PATH: upload.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Prepare Artifacts
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -name "*.apk" -exec cp {} artifacts/ \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: searchlauncher-apks
          path: artifacts/*.apk

      - name: Upload obfuscation mapping
        uses: actions/upload-artifact@v4
        with:
          name: searchlauncher-mapping
          path: app/build/outputs/mapping/*/mapping.txt

      - name: Upload App Bundle
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGNING_KEY_STORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: searchlauncher-aab
          path: app/build/outputs/bundle/release/*.aab

  release:
    needs: [build, play_apk]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download legacy F-Droid APK
        uses: actions/download-artifact@v4
        with:
          name: searchlauncher-apks
          path: legacy
      - name: Download Play-signed APK
        uses: actions/download-artifact@v4
        with:
          name: searchlauncher-play-apk
          path: play-apk
      - name: Publish compatible GitHub download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<'NOTES'
          **Install `app-play.apk` for the same signing identity as Google Play.**
          GitHub and Play can update this installation interchangeably when the version code permits.

          `app-release.apk` is retained only for existing legacy GitHub/F-Droid installs. Its older
          signing key is incompatible with Play. Switching from that copy requires exporting your
          data, removing it from every Android user/profile, and importing into the Play-signed app.

          NOTES
          cat "docs/releases/$GITHUB_REF_NAME.md" >> /tmp/release-notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --notes-file /tmp/release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" \
            'play-apk/app-play.apk#SearchLauncher - Google Play compatible' \
            'play-apk/app-play.json#Verified package, version and signing certificate' \
            'legacy/app-release.apk#Legacy GitHub and F-Droid signature - incompatible with Play' \
            --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest

  play_apk:
    needs: play
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
      - uses: android-actions/setup-android@v3
        with:
          packages: build-tools;36.0.0
      - name: Download and verify Play-signed universal APK
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_APP_SIGNING_SHA256: ${{ vars.PLAY_APP_SIGNING_SHA256 }}
        run: |
          python3 scripts/download-play-apk.py \
            --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            --aapt2 "$ANDROID_HOME/build-tools/36.0.0/aapt2"
      - uses: actions/upload-artifact@v4
        with:
          name: searchlauncher-play-apk
          path: play-apk/*
          if-no-files-found: error

  play:
    concurrency:
      group: play-production
      cancel-in-progress: false
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      # Skips rather than fails when the secret is missing, so a fork or a repo that has not
      # been connected to Play yet still gets a green build.
      - name: Check for Play credentials
        id: creds
        run: |
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "PLAY_SERVICE_ACCOUNT_JSON is not set; skipping the Play upload." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.present == 'true'

      - name: Download App Bundle
        if: steps.creds.outputs.present == 'true'
        uses: actions/download-artifact@v4
        with:
          name: searchlauncher-aab
          path: bundle

      - uses: ruby/setup-ruby@v1
        if: steps.creds.outputs.present == 'true'
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install fastlane
        if: steps.creds.outputs.present == 'true'
        run: gem install fastlane --no-document

      - name: Publish to production
        if: steps.creds.outputs.present == 'true'
        run: |
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > /tmp/play-key.json
          # Release notes come from fastlane/metadata/android/en-US/changelogs/<versionCode>.txt,
          # which supply reads without being told where it is.
          #
          # The listing text and images are deliberately NOT uploaded. The screenshots in
          # fastlane/metadata are the plain captures F-Droid shows; Play gets the composed ones
          # from marketing/out, which are uploaded by hand. Without these three flags supply
          # would quietly replace the composed listing with the plain captures.
          bundles=(bundle/*.aab)
          fastlane supply \
            --package_name com.searchlauncher.app \
            --aab "${bundles[0]}" \
            --track production \
            --release_status completed \
            --changes_not_sent_for_review false \
            --rescue_changes_not_sent_for_review false \
            --json_key /tmp/play-key.json \
            --skip_upload_metadata true \
            --skip_upload_images true \
            --skip_upload_screenshots true \
            --skip_upload_changelogs false
          rm -f /tmp/play-key.json
