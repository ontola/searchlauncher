name: Android CI

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}

    steps:
      - uses: actions/checkout@v3
      # 21 to match F-Droid's buildserver, which ships no other JDK. The APK we release has to
      # come out of the same compiler as the one F-Droid builds from source, or reproducible-build
      # verification fails. The app still targets 17 bytecode; see jvmTarget below.
      - name: set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Check code formatting
        run: ./gradlew spotlessCheck
      # Cheap, and catches the two things that only show up at upload time: store text that
      # was edited in the generated file instead of the source, and a changelog too long
      # for Play's 500-character limit. Standard library only, so nothing to install.
      - name: Check store text
        run: python3 marketing/copy.py --check
      - name: Decode Keystore
        if: ${{ env.SIGNING_KEY_STORE_BASE64 != '' }}
        run: |
          echo $SIGNING_KEY_STORE_BASE64 | base64 -d > app/upload.jks

      - name: Build with Gradle
        env:
          SIGNING_KEY_STORE_PATH: upload.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Run unit tests
        run: ./gradlew test

      # Play takes a bundle rather than an APK. Only worth building on a tag, since nothing
      # else consumes it, and it is a second full R8 pass.
      - name: Build App Bundle
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGNING_KEY_STORE_BASE64 != ''
        env:
          SIGNING_KEY_STORE_PATH: upload.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Prepare Artifacts
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -name "*.apk" -exec cp {} artifacts/ \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: searchlauncher-apks
          path: artifacts/*.apk

      - name: Upload App Bundle
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGNING_KEY_STORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: searchlauncher-aab
          path: app/build/outputs/bundle/release/*.aab

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: searchlauncher-apks
          path: .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.apk"
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  play:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      # Skips rather than fails when the secret is missing, so a fork or a repo that has not
      # been connected to Play yet still gets a green build.
      - name: Check for Play credentials
        id: creds
        run: |
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "PLAY_SERVICE_ACCOUNT_JSON is not set; skipping the Play upload." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v3
        if: steps.creds.outputs.present == 'true'

      - name: Download App Bundle
        if: steps.creds.outputs.present == 'true'
        uses: actions/download-artifact@v4
        with:
          name: searchlauncher-aab
          path: bundle

      - uses: ruby/setup-ruby@v1
        if: steps.creds.outputs.present == 'true'
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install fastlane
        if: steps.creds.outputs.present == 'true'
        run: gem install fastlane --no-document

      - name: Upload to the internal track
        if: steps.creds.outputs.present == 'true'
        run: |
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > /tmp/play-key.json
          # Release notes come from fastlane/metadata/android/en-US/changelogs/<versionCode>.txt,
          # which supply reads without being told where it is.
          #
          # The listing text and images are deliberately NOT uploaded. The screenshots in
          # fastlane/metadata are the plain captures F-Droid shows; Play gets the composed ones
          # from marketing/out, which are uploaded by hand. Without these three flags supply
          # would quietly replace the composed listing with the plain captures.
          fastlane supply \
            --package_name com.searchlauncher.app \
            --aab "$(ls bundle/*.aab | head -1)" \
            --track internal \
            --release_status completed \
            --json_key /tmp/play-key.json \
            --skip_upload_metadata true \
            --skip_upload_images true \
            --skip_upload_screenshots true \
            --skip_upload_changelogs false
          rm -f /tmp/play-key.json
