# TEMPORARY. Delete this file once the keystore has been recovered.
#
# The release keystore exists only as the SIGNING_KEY_STORE_BASE64 secret, which GitHub will
# not let anyone read back. Losing it would mean never being able to ship an update that
# installs over an existing copy, because Android refuses an update signed by another key,
# and F-Droid pins this one in AllowedAPKSigningKeys.
#
# This job hands it back, encrypted. The repository is public, so artifacts are world
# readable: the keystore is encrypted with openssl smime to a certificate whose private half
# never left the maintainer's machine, so the artifact is useless to anyone else. The secret
# itself is only ever written to a file, never echoed.
name: Recover keystore

on: workflow_dispatch

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt the keystore to the recovery certificate
        env:
          SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEY_STORE_BASE64" ]; then
            echo "SIGNING_KEY_STORE_BASE64 is not set; nothing to recover." >&2
            exit 1
          fi

          cat > recovery-public.pem <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIFLTCCAxWgAwIBAgIUBIkvZnUGdhdUgOWxiql6E9iTI94wDQYJKoZIhvcNAQEL
