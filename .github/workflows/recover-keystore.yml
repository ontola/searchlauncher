          -----END CERTIFICATE-----
          CERT
          sed -i 's/^[[:space:]]*//' recovery-public.pem

          echo "$SIGNING_KEY_STORE_BASE64" | base64 -d > keystore.jks
          echo "decoded $(stat -c%s keystore.jks) bytes"

          openssl smime -encrypt -aes256 -binary \
            -in keystore.jks -outform DER -out keystore.jks.enc recovery-public.pem
          echo "encrypted to $(stat -c%s keystore.jks.enc) bytes"

          # Only the ciphertext leaves this runner.
          rm -f keystore.jks

      - name: Upload the encrypted keystore
        uses: actions/upload-artifact@v4
        with:
          name: keystore-encrypted
          path: keystore.jks.enc
          retention-days: 1
