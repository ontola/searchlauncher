AntiFeatures:
  NonFreeNet:
    en-US: Search shortcuts and search suggestions query third-party services such
      as Google, YouTube and Wikipedia. They are optional and can be removed.
  Tracking:
    en-US: Optional crash reporting to a self-hosted GlitchTip instance. It is off
      until you opt in, and can be turned off again in Settings.
